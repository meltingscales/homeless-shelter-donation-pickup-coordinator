<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Dashboard - Shelter Pickup Coordinator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link">&larr; Back</a>
            <h1>Available Donations</h1>
            <p class="subtitle">Browse and claim donations for your shelter</p>
        </header>

        <main>
            <div class="filters">
                <div class="filter-group">
                    <label for="zip-filter">Filter by ZIP Code:</label>
                    <input type="text" id="zip-filter" placeholder="Enter ZIP code">
                    <button id="clear-filter" class="btn btn-small">Clear</button>
                </div>
            </div>

            <div id="donations-list" class="donations-list">
                <p class="loading">Loading donations...</p>
            </div>
        </main>
    </div>

    <!-- Claim Modal -->
    <div id="claim-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Claim This Donation</h2>
            <p>Enter your shelter information to claim this donation.</p>

            <form id="claim-form">
                <div class="form-group">
                    <label for="shelter_name">Shelter Name *</label>
                    <input type="text" id="shelter_name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="contact_name">Contact Name *</label>
                    <input type="text" id="contact_name" name="contact_name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="shelter_address">Address *</label>
                    <input type="text" id="shelter_address" name="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="shelter_city">City *</label>
                        <input type="text" id="shelter_city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="shelter_state">State *</label>
                        <input type="text" id="shelter_state" name="state" maxlength="2" required>
                    </div>
                    <div class="form-group">
                        <label for="shelter_zip">ZIP *</label>
                        <input type="text" id="shelter_zip" name="zip_code" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Claim Donation</button>
            </form>
        </div>
    </div>

    <script>
        let currentDonationId = null;
        let currentShelterId = null;

        // Load donations on page load
        loadDonations();

        // Filter by ZIP
        document.getElementById('zip-filter').addEventListener('input', (e) => {
            const zip = e.target.value.trim();
            if (zip.length >= 5) {
                loadDonations(zip);
            } else if (zip.length === 0) {
                loadDonations();
            }
        });

        document.getElementById('clear-filter').addEventListener('click', () => {
            document.getElementById('zip-filter').value = '';
            loadDonations();
        });

        // Modal controls
        const modal = document.getElementById('claim-modal');
        document.querySelector('.close').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        document.getElementById('claim-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await claimDonation();
        });

        async function loadDonations(zipFilter = null) {
            const url = zipFilter
                ? `/api/donations?status=available&zip_code=${zipFilter}`
                : '/api/donations?status=available';

            const response = await fetch(url);
            const donations = await response.json();

            const container = document.getElementById('donations-list');

            if (donations.length === 0) {
                container.innerHTML = '<p class="no-results">No donations found. Check back soon!</p>';
                return;
            }

            container.innerHTML = donations.map(d => `
                <div class="donation-card">
                    <div class="donation-header">
                        <span class="donation-id">#${d.id}</span>
                        <span class="donation-date">${new Date(d.created_at).toLocaleDateString()}</span>
                    </div>
                    <div class="donation-items">${escapeHtml(d.items)}</div>
                    ${d.notes ? `<div class="donation-notes"><strong>Notes:</strong> ${escapeHtml(d.notes)}</div>` : ''}
                    <div class="donation-location">
                        <strong>Location:</strong> ${escapeHtml(d.city)}, ${d.state} ${d.zip_code}
                    </div>
                    <button class="btn btn-primary" onclick='openClaimModal(${d.id})'>Claim Donation</button>
                </div>
            `).join('');
        }

        function openClaimModal(donationId) {
            currentDonationId = donationId;
            modal.style.display = 'block';
        }

        async function claimDonation() {
            const formData = new FormData(document.getElementById('claim-form'));
            const data = Object.fromEntries(formData);

            // First, create or get the shelter
            let shelterResponse = await fetch('/api/shelters', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (shelterResponse.ok) {
                const shelter = await shelterResponse.json();
                currentShelterId = shelter.id;
            } else {
                // Shelter might already exist, try to find it by name
                const sheltersResponse = await fetch('/api/shelters');
                const shelters = await sheltersResponse.json();
                const existing = shelters.find(s => s.name === data.name);
                if (existing) {
                    currentShelterId = existing.id;
                } else {
                    alert('Error registering shelter');
                    return;
                }
            }

            // Claim the donation
            const claimResponse = await fetch(`/api/donations/${currentDonationId}/claim/${currentShelterId}`, {
                method: 'POST'
            });

            if (claimResponse.ok) {
                alert('Donation claimed successfully! Contact info will be shared with the donor.');
                modal.style.display = 'none';
                loadDonations(document.getElementById('zip-filter').value);
            } else {
                alert('Error claiming donation');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
