<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Dashboard - Shelter Pickup Coordinator</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link">← Back to Home</a>
            <h1>Shelter Dashboard</h1>
        </header>

        <main>
            <div class="dashboard-header">
                <div class="dashboard-title">
                    <h2>Welcome, <span id="shelterName">Shelter</span>!</h2>
                </div>
                <div class="dashboard-actions">
                    <button class="btn btn-primary" onclick="showRegisterModal()">+ Register Shelter</button>
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="availableCount">0</div>
                    <div class="stat-label">Available Nearby</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="claimedCount">0</div>
                    <div class="stat-label">Claimed by Us</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="routesCount">0</div>
                    <div class="stat-label">Active Routes</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('donations')">Available Donations</button>
                <button class="tab-btn" onclick="showTab('claimed')">Our Claims</button>
                <button class="tab-btn" onclick="showTab('routes')">Routes</button>
            </div>

            <!-- Donations Tab -->
            <div id="donationsTab" class="tab-content">
                <div class="filters">
                    <div class="filter-group">
                        <label>ZIP Code:</label>
                        <input type="text" id="zipFilter" placeholder="Filter by ZIP">
                    </div>
                    <div class="filter-group">
                        <label>Radius (miles):</label>
                        <input type="number" id="radiusFilter" value="25" min="1" max="100">
                    </div>
                    <button class="btn btn-primary" onclick="loadNearbyDonations()">Search</button>
                </div>
                <div id="donationsList" class="donations-list">
                    <div class="loading">Loading nearby donations...</div>
                </div>
            </div>

            <!-- Claims Tab -->
            <div id="claimedTab" class="tab-content" style="display: none;">
                <div id="claimedList" class="donations-list">
                    <div class="loading">Loading claimed donations...</div>
                </div>
            </div>

            <!-- Routes Tab -->
            <div id="routesTab" class="tab-content" style="display: none;">
                <div class="form">
                    <h2>Create New Route</h2>
                    <form id="createRouteForm" onsubmit="handleCreateRoute(event)">
                        <div class="form-group">
                            <label>Route Name *</label>
                            <input type="text" id="routeName" required placeholder="e.g., Friday Pickup Route">
                        </div>
                        <div class="form-group">
                            <label>Description (optional)</label>
                            <input type="text" id="routeDescription" placeholder="Optional notes">
                        </div>
                        <button type="submit" class="btn btn-primary">Create Route</button>
                    </form>
                </div>
                <div id="routesList" class="donations-list">
                    <div class="loading">Loading routes...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Register Shelter Modal -->
    <div id="registerModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close" onclick="closeRegisterModal()">&times;</span>
            <h2>Register Shelter</h2>
            <form id="registerShelterForm" onsubmit="handleRegisterShelter(event)">
                <div class="form-group">
                    <label>Shelter Name *</label>
                    <input type="text" id="shelterNameInput" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Contact Name *</label>
                        <input type="text" id="shelterContact" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="shelterEmail" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="shelterPhone">
                </div>
                <div class="form-group">
                    <label>Street Address *</label>
                    <input type="text" id="shelterAddress" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" id="shelterCity" required>
                    </div>
                    <div class="form-group">
                        <label>State *</label>
                        <input type="text" id="shelterState" required maxlength="2" placeholder="IL">
                    </div>
                    <div class="form-group">
                        <label>ZIP Code *</label>
                        <input type="text" id="shelterZip" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="shelterDescription" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Needed Items</label>
                    <textarea id="shelterNeeds" rows="2" placeholder="e.g., blankets, coats, socks"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register Shelter</button>
                <p id="shelterError" class="error" style="display: none; margin-top: 10px;"></p>
            </form>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/shelter-dashboard.js"></script>
</body>
</html>
