<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard - Shelter Pickup Coordinator</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link">← Back to Home</a>
            <h1>Donor Dashboard</h1>
        </header>

        <main>
            <div class="dashboard-header">
                <div class="dashboard-title">
                    <h2>Welcome, <span id="userName">Donor</span>!</h2>
                </div>
                <div class="dashboard-actions">
                    <button class="btn btn-primary" onclick="showCreateModal()">+ New Donation</button>
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalDonations">0</div>
                    <div class="stat-label">Total Donations</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="availableDonations">0</div>
                    <div class="stat-label">Available</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="claimedDonations">0</div>
                    <div class="stat-label">Claimed</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label>Status:</label>
                    <select id="statusFilter" onchange="loadMyDonations()">
                        <option value="">All</option>
                        <option value="available">Available</option>
                        <option value="claimed">Claimed</option>
                        <option value="picked_up">Picked Up</option>
                    </select>
                </div>
            </div>

            <!-- Donations List -->
            <div id="donationsList" class="donations-list">
                <div class="loading">Loading your donations...</div>
            </div>
        </main>
    </div>

    <!-- Create Donation Modal -->
    <div id="createModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close" onclick="closeCreateModal()">&times;</span>
            <h2>Create New Donation</h2>
            <form id="createDonationForm" onsubmit="handleCreateDonation(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Your Name *</label>
                        <input type="text" id="donorName" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="donorEmail" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone (optional)</label>
                    <input type="tel" id="donorPhone">
                </div>
                <div class="form-group">
                    <label>Street Address *</label>
                    <input type="text" id="donorAddress" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" id="donorCity" required>
                    </div>
                    <div class="form-group">
                        <label>State *</label>
                        <input type="text" id="donorState" required maxlength="2" placeholder="IL">
                    </div>
                    <div class="form-group">
                        <label>ZIP Code *</label>
                        <input type="text" id="donorZip" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Items to Donate *</label>
                    <textarea id="donorItems" rows="3" required placeholder="e.g., 5 blankets, 2 winter coats, 10 pairs of socks"></textarea>
                    <small>Describe what items you're donating</small>
                </div>
                <div class="form-group">
                    <label>Notes (optional)</label>
                    <textarea id="donorNotes" rows="2" placeholder="Any special instructions or preferred pickup times"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Donation</button>
                <p id="createError" class="error" style="display: none; margin-top: 10px;"></p>
            </form>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/donor-dashboard.js"></script>
</body>
</html>
